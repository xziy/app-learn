# The Compose compiler plugin runs the JVM's default Metaspace out.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

kotlin.code.style=official

# The iOS klibs compile anywhere, linking needs a Mac with Xcode. Skipped without a
# warning on every build of the desktop.
kotlin.native.ignoreDisabledTargets=true
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx3g
